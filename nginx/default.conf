upstream app_backend {
    server kajak-kenu:8000;
}

server {
    listen 80;
    server_name _;

    # Do not log access to static files to keep logs smaller
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml font/woff2 font/woff application/font-woff;

    # Serve fingerprintable static assets with long cache where possible
    location ~* \.(?:css|js|webp|svg|woff2|woff|ttf)$ {
        root /var/www/html;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        add_header "X-Content-Type-Options" "nosniff";
    }

    # Serve static files (from mounted host folders)
    location /static/ {
        alias /var/www/html/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /var/www/html/uploads/;
        # keep uploads shorter as these may be updated via admin
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Fallback: proxy dynamic requests to the Flask app
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_pass http://app_backend;
        proxy_read_timeout 90;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
    }
}
