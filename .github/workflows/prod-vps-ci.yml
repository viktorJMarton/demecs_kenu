name: Prod VPS CI

on:
  push:
    branches:
      - prod-vps-files
      - 'feature/affiliate-*'
  pull_request:
    branches:
      - prod-vps-files
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Network-isolated regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/dev-compose.sh -p release-ci build test
      - run: scripts/dev-compose.sh -p release-ci run --no-deps --rm test

  package:
    name: Package release source
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/package-vps-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prod-vps-bundle
          path: prod-vps-bundle.tar.gz
          if-no-files-found: error
