name: "Prod VPS CI"

on:
  push:
    branches:
      - prod-vps-files
  pull_request:
    branches:
      - prod-vps-files
  workflow_dispatch:

jobs:
  test:
    name: "Install & test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest suite
        run: |
          pytest

  package:
    name: "Package tracked files"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive tracked files
        run: |
          git ls-files > /tmp/tracked-files.txt
          tar -czf prod-vps-bundle.tar.gz --files-from=/tmp/tracked-files.txt
          ls -lh prod-vps-bundle.tar.gz

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-vps-bundle
          path: prod-vps-bundle.tar.gzname: "Prod VPS CI"

