[tool:pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .venv node_modules .git .vscode instance logs public
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
markers =
    endpoint: HTTP endpoint tests
    integration: Full system integration tests
    route: Backend route logic tests
    unit: Individual component unit tests
    slow: Slow-running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning