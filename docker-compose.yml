services:
  kajak-kenu:
    build: .
    # No ports exposed to host, only internal network for Nginx
    expose:
      - "8000"
    volumes:
      - ./kajak_kenu.db:/app/kajak_kenu.db
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
      - ./flaskr:/app/flaskr
    environment:
      - FLASK_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/var/www/html/uploads:ro
      - ./flaskr/static:/var/www/html/static:ro
    depends_on:
      - kajak-kenu
    restart: unless-stopped
