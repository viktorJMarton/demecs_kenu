services:
  kajak-kenu:
    image: demecs-kenu:migration-safe
    build: .
    init: true
    # No ports exposed to host, only internal network for Nginx
    expose:
      - "8000"
    volumes:
      - ./kajak_kenu.db:/app/kajak_kenu.db
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
      - ./.env.runtime:/app/.env
    environment:
      - FLASK_ENV=production
    env_file:
      - path: .env.runtime
        format: raw
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx@sha256:8491795299c8e739b7fcc6285d531d9812ce2666e07bd3dd8db00020ad132295
    ports:
      - "${DEMECS_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/uploads:/var/www/html/uploads:ro
      - ./flaskr/static:/var/www/html/static:ro
    depends_on:
      kajak-kenu:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
