name: kajak-kenu-dev

x-dev-environment: &dev-environment
  APP_ENV: development
  APP_BASE_URL: http://localhost:18000
  APP_LOG_DIR: /app/var/logs
  DATABASE_URL: /app/var/kajak_kenu_dev.db
  SECRET_KEY: dev-only-secret-key-change-before-sharing-2026
  WTF_CSRF_SECRET_KEY: dev-only-csrf-key-change-before-sharing-2026
  ADMIN_USERS_JSON: '[{"username":"dev_admin","password_hash":"pbkdf2:sha256:1000$$5IzTdYVW$$e12f1559885745e1daea260c1644a9a4b167ad849378695de2704ffaaec5c8aa"}]'
  SIMPLEPAY_MERCHANT_ID: DEV_DISABLED
  SIMPLEPAY_SECRET_KEY: DEV_DISABLED
  SIMPLEPAY_SANDBOX: "true"
  SESSION_COOKIE_SECURE: "false"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment: *dev-environment
    expose:
      - "8000"
    volumes:
      - dev-data:/app/var
      - dev-cache:/app/instance
      - dev-uploads:/app/public/uploads
    networks:
      - dev-isolated
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8080"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dev-isolated
      - dev-edge
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=4m,mode=0755
    security_opt:
      - no-new-privileges:true
    restart: "no"

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      <<: *dev-environment
      APP_BASE_URL: http://localhost:8000
      DATABASE_URL: /tmp/kajak_kenu_test.db
      TESTING: "true"
    command: ["pytest", "-q"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/instance:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

networks:
  dev-isolated:
    internal: true
  dev-edge:

volumes:
  dev-data:
  dev-cache:
  dev-uploads:
