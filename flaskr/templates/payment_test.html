<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplePay Teszt Fizetés</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">SimplePay Teszt Fizetés</h1>
        
        <form action="/pay" method="POST" class="space-y-4">
            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700">Összeg (Ft)</label>
                <input type="number" id="amount" name="amount" value="10000" min="100" max="100000" 
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div>
                <label for="customerEmail" class="block text-sm font-medium text-gray-700">Email cím</label>
                <input type="email" id="customerEmail" name="customerEmail" value="test@example.com" required
                       class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                Fizetés indítása
            </button>
        </form>
        
        <div class="mt-6 p-4 bg-gray-50 rounded-md">
            <h3 class="text-sm font-medium text-gray-700 mb-2">Teszt információk:</h3>
            <ul class="text-xs text-gray-600 space-y-1">
                <li>• Merchant: SPS_TEST_MERCHANT</li>
                <li>• Sandbox környezet</li>
                <li>• Kártyás fizetés teszt</li>
            </ul>
        </div>
    </div>
</body>
</html>
