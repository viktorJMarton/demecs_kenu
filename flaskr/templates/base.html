<!doctype html>
<html lang="en" data-theme="winter">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Demecs Vízitúra{% endblock %}</title>
  <!-- Preconnect to providers we use for faster initial fetches -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <!-- Preload critical assets -->
  <link rel="preload" href="{{ url_for('static', filename='style.css') }}" as="style">
  <link rel="preload" href="{{ url_for('static', filename='logo.svg') }}" as="image">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="..\static\mobil.css">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='logo.svg') }}">
  <script type="module" src="https://unpkg.com/cally"></script>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script>
    window.csrfToken = "{{ csrf_token() }}";
    window.csrfHeaderName = 'X-CSRFToken';
  </script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* Base body styles (no global transform here). We apply the
       WebKit 3D transform at runtime only for iOS Safari to avoid
       side-effects on Android/desktop where it caused scrolling. */


    .glasstic {
      -webkit-backdrop-filter: blur(var(--glass-blur, 2px));
      backdrop-filter: blur(var(--glass-blur, 2px));
      background-color: rgba(0, 0, 0, 0.699);
      background-image: linear-gradient(135deg, oklch(100% 0 0 / var(--glass-opacity, 10%)), #0000), linear-gradient(var(--glass-reflect-degree, 100deg), oklch(100% 0 0 / var(--glass-reflect-opacity, 5%)) 15%, oklch(0% 0 0 / 0.253) 15%);
      box-shadow: 0 0 0 1px oklch(100% 0 0 / var(--glass-border-opacity, 20%)) inset, 0 0 0 2px #0000000d;
      text-shadow: 0 1px oklch(0% 0 0 / var(--glass-text-shadow-opacity, 5%));
      border-width: initial;
      border-style: none;
      border-color: initial;
      border-image: initial;
    }

    #tour-map-overlay {
      transition: background-color 0.35s ease, backdrop-filter 0.35s ease;
      -webkit-backdrop-filter: blur(0px);
      backdrop-filter: blur(0px);
    }

    #tour-map-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.35), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(14, 165, 233, 0.25), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.25), transparent 55%);
      filter: blur(20px);
      transition: opacity 0.4s ease;
    }

    #tour-map-overlay[data-state="open"] {
      background-color: rgba(12, 24, 54, 0.75);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      backdrop-filter: blur(10px) saturate(120%);
    }

    #tour-map-overlay[data-state="open"]::before {
      opacity: 1;
      animation: overlayAurora 12s ease-in-out infinite;
    }

    .map-overlay-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(147, 197, 253, 0.25);
    }

    .map-overlay-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(191, 219, 254, 0.35), transparent 55%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      mix-blend-mode: screen;
    }

    #tour-map-overlay[data-state="open"] .map-overlay-card {
      animation: mapOverlayCardIn 0.45s cubic-bezier(0.32, 0.72, 0, 1) both;
    }

    #tour-map-overlay[data-state="open"] .map-overlay-card::before {
      opacity: 1;
      animation: overlayGlowSweep 5s ease-in-out infinite;
    }

    #tour-map-canvas {
      position: relative;
    }

    #tour-map-canvas::after {
      content: "";
      position: absolute;
      inset: -15%;
      background: radial-gradient(circle at 30% 30%, rgba(125, 211, 252, 0.35), transparent 55%),
        radial-gradient(circle at 70% 60%, rgba(59, 130, 246, 0.3), transparent 60%);
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      transform: scale(0.95);
    }

    #tour-map-overlay[data-state="open"] #tour-map-canvas::after {
      opacity: 0.45;
      animation: overlayLightPulse 6s linear infinite;
    }

    .location-card {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.35s ease;
    }

    .location-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 rgba(59, 130, 246, 0);
      opacity: 0;
      transform: scale(0.97);
      transition: box-shadow 0.4s ease, opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    .location-card:hover::before,
    .location-card:focus-visible::before,
    .location-card:focus-within::before {
      opacity: 1;
      transform: scale(1);
      box-shadow:
        inset 0 18px 36px rgba(59, 130, 246, 0.18),
        inset 0 -18px 36px rgba(14, 165, 233, 0.12),
        inset 0 0 0 1px rgba(59, 130, 246, 0.35);
    }

    .location-card::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 160%;
      height: 160%;
      transform: translate(-50%, -50%) scale(0.4);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.22), transparent 60%);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      filter: blur(2px);
    }

    .location-card:active::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    @keyframes overlayAurora {
      0% {
        transform: translate3d(-5%, 5%, 0);
      }

      50% {
        transform: translate3d(5%, -5%, 0);
      }

      100% {
        transform: translate3d(-4%, 4%, 0);
      }
    }

    @keyframes overlayGlowSweep {
      0% {
        transform: translate3d(-10%, 15%, 0) scale(0.95);
      }

      50% {
        transform: translate3d(10%, -5%, 0) scale(1.05);
      }

      100% {
        transform: translate3d(-5%, 10%, 0) scale(0.98);
      }
    }

    @keyframes overlayLightPulse {
      0% {
        transform: scale(0.9) rotate(0deg);
        opacity: 0.15;
      }

      50% {
        transform: scale(1.05) rotate(8deg);
        opacity: 0.45;
      }

      100% {
        transform: scale(0.95) rotate(0deg);
        opacity: 0.2;
      }
    }

    @keyframes mapOverlayCardIn {
      0% {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
        filter: blur(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #tour-map-overlay,
      #tour-map-overlay::before,
      .map-overlay-card,
      #tour-map-canvas::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* On small/low-power devices disable expensive backdrop-filter effects
       which can cause large GPU overdraw and make video playback/scrolling stutter. 
       Extended to 768px to cover most tablets and large phones. */
    @media (max-width: 768px) {

      .glasstic,
      #tour-map-overlay,
      .map-overlay-card,
      .hero-overlay,
      .backdrop-filter {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
        filter: none !important;
      }
    }

    body.preload-active {
      overflow: hidden;
    }

    .page-preloader {
      position: fixed;
      inset: 0;
      z-index: 200000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.25rem;
      background: radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.25), rgba(15, 23, 42, 0.95));
      color: #f8fafc;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .page-preloader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .page-preloader__spinner {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38bdf8;
      animation: preloaderSpin 1s linear infinite;
    }

    .page-preloader__text {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: rgba(248, 250, 252, 0.8);
    }

    @keyframes preloaderSpin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <style>
    /* iOS/Safari modal safety rules: prevent horizontal panning inside modals
       and ensure modal content fits the viewport. Kept minimal to avoid layout regressions. */
    .modal,
    .booking-modal-container,
    .booking-modal-shell {
      overflow-x: hidden !important;
      touch-action: pan-y !important;
      /* allow vertical scrolling only */
      overscroll-behavior-x: contain;
      /* avoid horizontal rubber-band escape */
      -webkit-overflow-scrolling: touch;
      max-width: 100vw !important;
      box-sizing: border-box;
    }

    .modal .modal-box,
    .booking-modal-shell,
    .booking-modal-scroll {
      overflow-x: hidden !important;
      max-width: 100% !important;
      box-sizing: border-box;
    }

    /* Ensure any inner carousels or wide lists inside modals do not force horizontal overflow */
    .booking-modal-scroll,
    .carousel,
    .tour-carousel,
    .carousel-item,
    .booking-modal-container * {
      max-width: 100% !important;
      overflow-x: hidden !important;
      box-sizing: border-box;
    }

    /* If the site intentionally needs horizontal swipes for a component (carousel),
       that component should explicitly enable pan-x; this keeps modal default safe. */
    .carousel {
      touch-action: pan-x;
    }
  </style>
  </style>
  <style>
    /* iOS Safari Fixes for Map Overlay */
    body.map-overlay-active {
      /* Disable the global transform fix when map is active to avoid stacking context issues */
      transform: none !important;
      -webkit-transform: none !important;
    }

    body.map-overlay-active .modal-box {
      /* Hide underlying modals effectively to prevent z-index fighting */
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    body.map-overlay-active .modal-backdrop {
      z-index: -1 !important;
      /* Move backdrop out of the way */
    }
  </style>
</head>

<body class="bg-base-200 min-h-screen w-full overflow-x-hidden">
  <div id="page-preloader" class="page-preloader" role="status" aria-live="polite">
    <div class="page-preloader__spinner" aria-hidden="true"></div>
    <p class="page-preloader__text">Betöltés alatt...</p>
  </div>
  {% for message in get_flashed_messages() %}
  <div class="alert alert-info mb-4">{{ message }}</div>
  {% endfor %}

  <!-- Admin gyorslinkek (csak bejelentkezés után) -->


  {% block content %}{% endblock %}

  <!-- Globális térkép overlay -->
  <div id="tour-map-overlay" class="fixed inset-0 z-[100000] hidden items-center justify-center bg-black/60 p-4"
    data-state="closed" role="dialog" aria-modal="true" aria-hidden="true">
    <button type="button" aria-label="Térkép bezárása" class="btn btn-circle absolute right-4 top-4"
      data-close-map-overlay>✕</button>
    <div class="w-full max-w-4xl">
      <div class="map-overlay-card bg-base-100 rounded-2xl shadow-2xl overflow-hidden">
        <div id="tour-map-canvas" data-map-canvas class="w-full h-[60dvh] min-h-[400px] max-h-[85vh] bg-base-200"
          style="position: relative; z-index: 100002;"></div>
      </div>
    </div>
  </div>

  <!-- Alap szkriptek -->
  <script src="{{ url_for('static', filename='realtime.js') }}"></script>
  <script src="{{ url_for('static', filename='map-overlay.js') }}"></script>
  <script src="{{ url_for('static', filename='calendar-modal.js') }}?v=20260217b"></script>
  <script src="{{ url_for('static', filename='modal-control.js') }}?v=20260217b"></script>
  {% block scripts %}{% endblock %}
  <script>
    (function () {
      const body = document.body;
      const preloader = document.getElementById('page-preloader');
      if (!body || !preloader) return;

      body.classList.add('preload-active');
      const MIN_VISIBLE_MS = 700;
      const MAX_WAIT_MS = 8000;
      const shownAt = performance.now();
      let resolved = false;

      function hidePreloader(reason) {
        if (resolved) return;
        resolved = true;
        const elapsed = performance.now() - shownAt;
        const delay = Math.max(0, MIN_VISIBLE_MS - elapsed);
        setTimeout(() => {
          body.classList.remove('preload-active');
          preloader.classList.add('is-hidden');
          preloader.setAttribute('data-hide-reason', reason || 'unknown');
        }, delay);
      }

      window.addEventListener('demecs:heroReady', () => hidePreloader('hero-ready'), { once: true });
      window.addEventListener('load', () => hidePreloader('window-load'), { once: true });
      setTimeout(() => hidePreloader('timeout'), MAX_WAIT_MS);
    })();
  </script>
  <script>
    /* Apply WebKit 3D transform only on iOS Safari to fix stacking/context
       rendering bugs for modals. Detects iOS devices and WebKit. */
    (function () {
      function isIosWebkit() {
        if (typeof navigator === 'undefined') return false;
        const ua = navigator.userAgent || '';
        const isIOS = /iP(ad|hone|od)/i.test(ua) || (navigator.platform && /MacIntel/.test(navigator.platform) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
        const isWebKit = /AppleWebKit/i.test(ua) && !/CriOS|Chrome|FxiOS|OPiOS/i.test(ua);
        return isIOS && isWebKit;
      }

      if (isIosWebkit()) {
        try {
          document.documentElement.style.setProperty('--webkit-modal-fix', '1');
          // Apply transform only when running on iOS WebKit
          document.body.style.webkitTransform = 'translate3d(0,0,0)';
          document.body.style.transform = 'translate3d(0,0,0)';
          document.body.style.webkitBackfaceVisibility = 'hidden';
        } catch (e) {
          // ignore
        }
      }
    })();
  </script>
  <script>
    // Ensure the modal checkbox and modal overlay are direct children of <body>
    // so they are not trapped in any transformed/stacked parent (Safari bug).
    // Also add scroll-lock behavior while modal is open (works on iOS/Android/desktop).
    document.addEventListener('DOMContentLoaded', function () {
      try {
        const modalToggle = document.getElementById('my_modal_7');
        if (!modalToggle) return;

        // utilities for scroll lock
        let savedBodyScrollY = 0;
        const savedBodyStyle = {};

        function lockBodyScroll() {
          // Save current scroll position and body styles
          savedBodyScrollY = window.scrollY || window.pageYOffset || 0;
          savedBodyStyle.position = document.body.style.position || '';
          savedBodyStyle.top = document.body.style.top || '';
          savedBodyStyle.width = document.body.style.width || '';
          savedBodyStyle.overflow = document.body.style.overflow || '';
          savedBodyStyle.transform = document.body.style.transform || '';
          savedBodyStyle.webkitTransform = document.body.style.webkitTransform || '';

          // Lock scroll by fixing the body at current scroll position
          document.body.style.position = 'fixed';
          document.body.style.top = `-${savedBodyScrollY}px`;
          document.body.style.width = '100%';
          document.body.style.overflow = 'hidden';
          // prevent overscroll on iOS
          document.documentElement.style.overscrollBehavior = 'none';

          // Disable transform to fix fixed-position children (modals) becoming relative to body
          document.body.style.transform = 'none';
          document.body.style.webkitTransform = 'none';
        }

        function unlockBodyScroll() {
          // Restore styles
          document.body.style.position = savedBodyStyle.position;
          document.body.style.top = savedBodyStyle.top;
          document.body.style.width = savedBodyStyle.width;
          document.body.style.overflow = savedBodyStyle.overflow;
          document.documentElement.style.overscrollBehavior = '';

          // Restore transform
          if (savedBodyStyle.transform) document.body.style.transform = savedBodyStyle.transform;
          if (savedBodyStyle.webkitTransform) document.body.style.webkitTransform = savedBodyStyle.webkitTransform;

          // Jump back to saved scroll position
          window.scrollTo(0, savedBodyScrollY);
        }

        // Find the closest modal overlay container for this toggle
        let modalEl = modalToggle.closest('.modal');
        if (!modalEl) {
          modalEl = document.querySelector('.modal');
        }

        // Find the modal backdrop label for this modal (DaisyUI pattern)
        const modalId = modalToggle.id;
        let modalBackdrop = document.querySelector(`label.modal-backdrop[for="${modalId}"]`);
        if (!modalBackdrop) {
          modalBackdrop = document.querySelector('label.modal-backdrop');
        }

        if (modalToggle && modalEl && modalEl.parentNode !== document.body) {
          // Move the toggle and modal to the end of body in order
          document.body.appendChild(modalToggle);
          document.body.appendChild(modalEl);
        }

        if (modalBackdrop && modalBackdrop.parentNode !== document.body) {
          // Ensure the backdrop is also a direct child of body so it covers viewport
          document.body.appendChild(modalBackdrop);
        }

        // When the checkbox changes (modal opens/closes), lock/unlock scroll
        modalToggle.addEventListener('change', function () {
          try {
            if (modalToggle.checked) {
              lockBodyScroll();
            } else {
              unlockBodyScroll();
            }
          } catch (e) { /* ignore */ }
        });

        // Also ensure clicking the backdrop unlocks scroll (label click toggles checkbox)
        if (modalBackdrop) {
          modalBackdrop.addEventListener('click', function () {
            // small delay to allow checkbox change to fire first
            setTimeout(() => {
              if (!modalToggle.checked) {
                try { unlockBodyScroll(); } catch (e) { }
              }
            }, 10);
          });
        }

        // Defensive: if modal removed from DOM while open, restore scroll
        window.addEventListener('beforeunload', function () {
          if (modalToggle.checked) {
            try { unlockBodyScroll(); } catch (e) { }
          }
        });

      } catch (e) {
        // fail silently
      }
    });
  </script>

  <script>
    (function () {
      // iOS safe-area aware scroll lock helper without the harmful overlay hacks
      function isIOS() {
        return /iP(hone|od|ad)/.test(navigator.platform) || (navigator.userAgent.includes('Mac') && 'ontouchend' in document);
      }
      if (isIOS()) {
        document.documentElement.style.setProperty('--ios-safe-bottom', 'env(safe-area-inset-bottom, 20px)');
      }
    })();
  </script>

</body>

</html>
