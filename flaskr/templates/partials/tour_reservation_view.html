    <script>
// Global function to update carousel images
window.updateCarouselImages = function(images) {
  // console.log('🖼️ Updating carousel with images:', images);
  
  const scope = document.getElementById('reservation-view-content') || document;
  const imagesSection = document.getElementById('tour-images-section');
  
  if (images && Array.isArray(images) && images.length > 0) {
    // console.log(`✅ ${images.length} kép betöltése...`);
    
    // Van kép, megjelenítjük a carousel-t
    if (imagesSection) {
      imagesSection.style.display = 'block';
      // console.log('✅ Carousel section megmutatva');
    }
    
    for (let i = 1; i <= 4; i++) {
      const imgEl = scope.querySelector(`#tour-image-${i}`);
      if (imgEl) {
        if (images[i - 1]) {
          // Van kép ezen az indexen
          const img = images[i - 1];
          
          // Használjuk az URL-t (egyszerű megoldás)
            if (img.url) {
            imgEl.src = img.url;
            // console.log(`✅ Image ${i} loaded from URL: ${img.url}`);
          } else if (img.file_path) {
            // Fallback file_path megoldás
            imgEl.src = `/uploads/${img.file_path}`;
            // console.log(`✅ Image ${i} loaded from file_path: ${img.file_path}`);
          } else {
            // Nincs URL vagy file_path
            imgEl.src = '';
            console.warn(`⚠️ Image ${i} has no URL or file_path`);
          }
          
          imgEl.alt = img.filename || `Túra kép ${i}`;
        } else {
          // Nincs több kép, üres src
          imgEl.src = '';
          // console.log(`ℹ️ Image ${i} slot empty`);
        }
      } else {
        console.warn(`⚠️ Image element #tour-image-${i} not found`);
      }
    }
  } else {
    // Nincs kép, elrejtjük a carousel-t
    // console.log('⚠️ No images provided, hiding carousel');
    if (imagesSection) {
      imagesSection.style.display = 'none';
    }
    
    // Ürítjük a képeket
    for (let i = 1; i <= 4; i++) {
      const imgEl = scope.querySelector(`#tour-image-${i}`);
      if (imgEl) imgEl.src = '';
    }
  }
};
</script>
