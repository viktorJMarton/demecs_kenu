<script>
var map = null;

function initializeMap() {
  const mapDiv = document.getElementById('map');
  if (!mapDiv) return;
  
  // Create map centered on Budapest
  map = L.map('map').setView([47.4979, 19.0402], 10); 
  
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  
  // Force invalidate size after DOM ready
  setTimeout(() => {
    if (map) map.invalidateSize();
  }, 100);
}

// Global function for updating tour map data  
window.updateTourMapData = function(tourData) {
  if (map && tourData && tourData.latitude && tourData.longitude) {
    // Clear existing markers
    map.eachLayer(function (layer) {
      if (layer instanceof L.Marker) {
        map.removeLayer(layer);
      }
    });
    
    // Add new marker for tour location
    map.setView([tourData.latitude, tourData.longitude], 13);
    L.marker([tourData.latitude, tourData.longitude]).addTo(map)
      .bindPopup(tourData.location || 'Túra helyszíne')
      .openPopup();
    map.invalidateSize();
  }
};

// Wait for modal visibility and initialize
function waitForModal() {
  let attempts = 0;
  const checkInterval = setInterval(() => {
    const mapDiv = document.getElementById('map');
    attempts++;
    
    if (mapDiv && mapDiv.offsetWidth > 0) {
      clearInterval(checkInterval);
      if (!map) initializeMap();
    } else if (attempts >= 30) {
      clearInterval(checkInterval);
      if (!map) initializeMap(); // Fallback init
    }
  }, 100);
}

// Start when DOM ready
document.addEventListener('DOMContentLoaded', waitForModal);

// Global function to update carousel images
window.updateCarouselImages = function(images) {
  console.log('🖼️ Updating carousel with images:', images);
  
  const scope = document.getElementById('reservation-view-content') || document;
  const imagesSection = document.getElementById('tour-images-section');
  
  if (images && Array.isArray(images) && images.length > 0) {
    console.log(`✅ ${images.length} kép betöltése...`);
    
    // Van kép, megjelenítjük a carousel-t
    if (imagesSection) {
      imagesSection.style.display = 'block';
      console.log('✅ Carousel section megmutatva');
    }
    
    for (let i = 1; i <= 4; i++) {
      const imgEl = scope.querySelector(`#tour-image-${i}`);
      if (imgEl) {
        if (images[i - 1]) {
          // Van kép ezen az indexen
          const img = images[i - 1];
          
          // Használjuk az URL-t (egyszerű megoldás)
          if (img.url) {
            imgEl.src = img.url;
            console.log(`✅ Image ${i} loaded from URL: ${img.url}`);
          } else if (img.file_path) {
            // Fallback file_path megoldás
            imgEl.src = `/uploads/${img.file_path}`;
            console.log(`✅ Image ${i} loaded from file_path: ${img.file_path}`);
          } else {
            // Nincs URL vagy file_path
            imgEl.src = '';
            console.warn(`⚠️ Image ${i} has no URL or file_path`);
          }
          
          imgEl.alt = img.filename || `Túra kép ${i}`;
        } else {
          // Nincs több kép, üres src
          imgEl.src = '';
          console.log(`ℹ️ Image ${i} slot empty`);
        }
      } else {
        console.warn(`⚠️ Image element #tour-image-${i} not found`);
      }
    }
  } else {
    // Nincs kép, elrejtjük a carousel-t
    console.log('⚠️ No images provided, hiding carousel');
    if (imagesSection) {
      imagesSection.style.display = 'none';
    }
    
    // Ürítjük a képeket
    for (let i = 1; i <= 4; i++) {
      const imgEl = scope.querySelector(`#tour-image-${i}`);
      if (imgEl) imgEl.src = '';
    }
  }
};

// Also try when modal becomes visible (DaisyUI modal support)
if (typeof MutationObserver !== 'undefined') {
  const observer = new MutationObserver(function(mutations) {
    const mapDiv = document.getElementById('map');
    if (mapDiv && mapDiv.offsetWidth > 0 && !map) {
      initializeMap();
    }
  });
  
  observer.observe(document.body, { 
    childList: true, 
    subtree: true, 
    attributes: true 
  });
}
</script>
