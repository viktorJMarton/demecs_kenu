<!--
    Modal for displaying the calendar and tour reservations.
    - `x-data`: Alpine.js component state for managing modal visibility, views, and data.
    - `@open-calendar-modal.window`: Listens for a global event to open the modal.
    - `@keydown.escape.window`: Closes the modal on Escape key press.
-->
<div
  x-data="calendarModal()"
  x-show="isOpen"
  x-cloak
  @open-calendar-modal.window="openModal($event.detail)"
  @keydown.escape.window="closeModal()"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 p-4"
>
  <!-- Modal Content -->
  <div
    @click.outside="closeModal()"
    class="relative mx-auto flex h-full max-h-[95vh] w-full max-w-6xl flex-col rounded-lg bg-gray-800 text-gray-200 shadow-2xl"
  >
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-gray-700 p-4">
      <h2 class="text-2xl font-bold text-white">Túra Naptár és Foglalás</h2>
      <button @click="closeModal()" class="text-gray-400 hover:text-white">&times;</button>
    </div>

    <!-- Body -->
    <div class="flex-grow overflow-y-auto p-6">
      <!-- Calendar View -->
      <div id="calendar-view" x-show="currentView === 'calendar'">
        <div class="grid grid-cols-1 gap-8 md:grid-cols-2">
          <!-- Calendar -->
          <div class="rounded-lg bg-gray-900 p-4 shadow-inner">
            <c-calendar id="tour-calendar" class="mx-auto"></c-calendar>
          </div>
          <!-- Tour List -->
          <div id="tour-list-container" class="overflow-y-auto" style="max-height: 70vh;">
            <h3 id="tour-list-header" class="mb-4 text-xl font-semibold"></h3>
            <ul id="tour-list" class="space-y-3">
              <!-- Tour items will be injected here by JavaScript -->
            </ul>
          </div>
        </div>
      </div>

      <!-- Reservation View -->
      <div id="reservation-view" x-show="currentView === 'reservation'" class="hidden">
        <button id="back-to-calendar" @click="showCalendar()" class="mb-4 rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
          &larr; Vissza a naptárhoz
        </button>
        <div id="reservation-view-content">
          <!-- Tour details will be loaded here -->
        </div>
      </div>
    </div>
  </div>
</div>

<!--
  JavaScript for Calendar Modal Logic
  - Handles opening/closing the modal.
  - Manages view switching between calendar and reservation.
  - Fetches and displays tour data.
  - Interacts with the Cally calendar component.
-->
<script>
function calendarModal() {
  return {
    isOpen: false,
    currentView: 'calendar', // 'calendar' or 'reservation'
    allTours: [],
    currentMonth: new Date().toISOString().slice(0, 7), // YYYY-MM

    openModal(detail) {
      this.isOpen = true;
      this.allTours = detail.tours || [];
      this.currentMonth = new Date().toISOString().slice(0, 7);
      this.filterToursByMonth(this.currentMonth);
      this.initCalendar();
    },

    closeModal() {
      this.isOpen = false;
    },

    showCalendar() {
      this.currentView = 'calendar';
    },

    showReservation() {
      this.currentView = 'reservation';
    },

    filterToursByMonth(month) {
      const tourList = document.getElementById('tour-list');
      const header = document.getElementById('tour-list-header');
      if (!tourList || !header) return;

      const monthTours = this.allTours.filter(tour => tour.date.startsWith(month));
      
      const monthNames = ["január", "február", "március", "április", "május", "június", "július", "augusztus", "szeptember", "október", "november", "december"];
      const monthName = monthNames[new Date(month + '-02').getMonth()];
      header.textContent = `${monthName.charAt(0).toUpperCase() + monthName.slice(1)}i túrák`;

      tourList.innerHTML = '';
      if (monthTours.length > 0) {
        monthTours.forEach(tour => {
          const li = document.createElement('li');
          li.className = 'tour-item cursor-pointer rounded-lg bg-gray-700 p-4 hover:bg-gray-600 transition-colors';
          li.dataset.tourId = tour.id;
          li.innerHTML = `
            <div class="font-bold">${tour.title}</div>
            <div>${tour.date}</div>
          `;
          li.addEventListener('click', () => this.showTourDetails(tour.id));
          tourList.appendChild(li);
        });
      } else {
        tourList.innerHTML = '<li>Nincsenek túrák ebben a hónapban.</li>';
      }
      this.markTourDaysInCalendar(monthTours);
    },

    markTourDaysInCalendar(tours) {
        const calendar = document.getElementById('tour-calendar');
        if (!calendar) return;

        const tourDays = new Set(tours.map(t => new Date(t.date).getDate()));

        // Clear previous markings
        const dayElements = calendar.shadowRoot.querySelectorAll('.day');
        dayElements.forEach(dayEl => {
            dayEl.classList.remove('tour-day');
        });

        // Mark new days
        tourDays.forEach(day => {
            const dayEl = calendar.shadowRoot.querySelector(`.day[data-day='${day}']`);
            if (dayEl) {
                dayEl.classList.add('tour-day');
            }
        });
    },

    showTourDetails(tourId) {
        fetch(`/tour/${tourId}`)
            .then(response => response.text())
            .then(html => {
                document.getElementById('reservation-view-content').innerHTML = html;
                this.showReservation();
                // Initialize map or other scripts if needed
                if (window.ensureTourMapInitialized) {
                    window.ensureTourMapInitialized();
                }
            })
            .catch(error => console.error('Error fetching tour details:', error));
    },

    initCalendar() {
      const calendar = document.getElementById('tour-calendar');
      if (!calendar || calendar.dataset.initialized) return;
      calendar.dataset.initialized = true;

      calendar.addEventListener('month-changed', (e) => {
        this.currentMonth = e.detail.month;
        this.filterToursByMonth(this.currentMonth);
      });

      calendar.addEventListener('date-selected', (e) => {
        const selectedDate = e.detail.date;
        const toursOnDate = this.allTours.filter(tour => tour.date === selectedDate);
        if (toursOnDate.length > 0) {
            this.showTourDetails(toursOnDate[0].id);
        }
      });
    }
  };
}
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const backBtn = document.getElementById('back-to-calendar');
  if (backBtn) {
    // Ne kényszerítsük mindig láthatóra; állapot alapján kezeljük
    backBtn.addEventListener('click', () => {
      const calView = document.getElementById('calendar-view');
      const resView = document.getElementById('reservation-view');
      if (calView && resView) {
        resView.classList.add('hidden');
        calView.classList.remove('hidden');
      }
      // Visszaváltás után rejtsük el a gombot
      if (typeof window.updateBackButtonVisibility === 'function') {
        window.updateBackButtonVisibility();
      }
    });
    // Kezdeti szinkronizálás
    if (typeof window.updateBackButtonVisibility === 'function') {
      window.updateBackButtonVisibility();
    }
  }
});
</script>
